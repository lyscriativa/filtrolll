<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Moldura personalizada</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
    button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
    #palco{position:fixed;inset:0;overflow:hidden;background:#000}
    #camera{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    #camera.espelho{transform:scaleX(-1)}
    #moldura{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;z-index:2}
    #inicio{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:26px;background:#000;color:#fff;text-align:center}
    #inicio button{width:min(290px,100%);border:0;border-radius:999px;padding:15px 24px;background:#fff;color:#222;font-weight:700}
    #inicio #abrirGaleria{background:#f0f0f0}
    #erro{display:none;max-width:430px;color:#ffc7c7;line-height:1.4}
    #controles{position:fixed;left:0;right:0;bottom:calc(38px + env(safe-area-inset-bottom));z-index:10;display:none;align-items:center;justify-content:center;gap:16px}
    .botao-redondo{width:62px;height:62px;border:0;border-radius:50%;background:#fff;font-size:25px;box-shadow:0 4px 12px rgba(0,0,0,.35)}
    #pararVideo{display:none;background:#fff;color:#d00000}
    #gravando{position:fixed;top:calc(18px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:12;display:none;padding:8px 14px;border-radius:999px;background:rgba(0,0,0,.72);color:#fff;font-weight:700}
    #preparando{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:25px;background:rgba(0,0,0,.78);color:#fff;text-align:center;font-weight:700}
    .previa{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;background:#111;padding:18px 18px calc(22px + env(safe-area-inset-bottom))}
    .previa img,.previa video{width:100%;height:calc(100% - 150px);object-fit:contain;background:#000;border-radius:12px}
    .acoes{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:14px}
    .acoes button{border:0;border-radius:10px;padding:12px 16px;background:#fff;color:#222;font-weight:700}
    .acoes .salvar{background:#36a852;color:#fff}
    #canvasFoto,#canvasVideo,#seletorGaleria{display:none}
    #editorGaleria{position:fixed;inset:0;z-index:45;display:none;flex-direction:column;align-items:center;justify-content:center;background:#111;padding:12px 12px calc(18px + env(safe-area-inset-bottom))}
    #editorGaleria p{margin:0 0 9px;color:#fff;text-align:center;font-size:14px}
    #canvasEditor{display:block;max-width:100%;height:calc(100% - 115px);max-height:calc((100vw - 24px) * 1.77778);aspect-ratio:9/16;background:#000;touch-action:none;user-select:none;-webkit-user-select:none}
  </style>
</head>
<body>
  <main id="palco">
    <video id="camera" autoplay muted playsinline></video>
    <img id="moldura" src="moldura.png" alt="Moldura do evento">
  </main>
  <section id="inicio">
    <h2>Moldura personalizada</h2>
    <p>Tire uma foto agora ou escolha uma foto que já está no celular.</p>
    <button id="abrirCamera">📷 Abrir câmera</button>
    <button id="abrirGaleria">🖼️ Escolher foto da galeria</button>
    <p id="erro"></p>
  </section>
  <input id="seletorGaleria" type="file" accept="image/*">
  <div id="gravando">🔴 REC <span id="tempo">00:00</span></div>
  <div id="preparando">Aguarde… preparando o seu arquivo.</div>
  <nav id="controles" aria-label="Controles da câmera">
    <button class="botao-redondo" id="trocarCamera" title="Trocar câmera">🔄</button>
    <button class="botao-redondo" id="tirarFoto" title="Tirar foto">📸</button>
    <button class="botao-redondo" id="gravarVideo" title="Gravar vídeo">🎥</button>
    <button class="botao-redondo" id="escolherGaleria" title="Escolher da galeria">🖼️</button>
    <button class="botao-redondo" id="pararVideo" title="Parar gravação">⏹</button>
  </nav>
  <canvas id="canvasFoto"></canvas>
  <canvas id="canvasVideo"></canvas>
  <section id="editorGaleria">
    <p>Arraste para posicionar • Use dois dedos para aumentar ou diminuir</p>
    <canvas id="canvasEditor" width="720" height="1280"></canvas>
    <div class="acoes">
      <button id="cancelarEdicao">Cancelar</button>
      <button id="redefinirFoto">Redefinir</button>
      <button class="salvar" id="concluirEdicao">Usar esta foto</button>
    </div>
  </section>
  <section class="previa" id="previaFoto">
    <img id="imagemFoto" alt="Prévia da foto">
    <div class="acoes">
      <button id="novaFoto">Voltar</button>
      <button id="outraGaleria">Escolher outra</button>
      <button class="salvar" id="salvarFoto">Salvar</button>
      <button id="compartilharFoto">Compartilhar</button>
    </div>
  </section>
  <section class="previa" id="previaVideo">
    <video id="videoPronto" controls playsinline></video>
    <div class="acoes">
      <button id="novoVideo">Gravar outro</button>
      <button class="salvar" id="salvarVideo">Salvar vídeo</button>
      <button id="compartilharVideo">Compartilhar</button>
    </div>
  </section>
  <script>
    const camera=document.getElementById('camera');
    const moldura=document.getElementById('moldura');
    const inicio=document.getElementById('inicio');
    const erro=document.getElementById('erro');
    const controles=document.getElementById('controles');
    const gravando=document.getElementById('gravando');
    const tempo=document.getElementById('tempo');
    const preparando=document.getElementById('preparando');
    const seletorGaleria=document.getElementById('seletorGaleria');
    const editorGaleria=document.getElementById('editorGaleria');
    const canvasEditor=document.getElementById('canvasEditor');
    const canvasFoto=document.getElementById('canvasFoto');
    const canvasVideo=document.getElementById('canvasVideo');
    const previaFoto=document.getElementById('previaFoto');
    const previaVideo=document.getElementById('previaVideo');
    const imagemFoto=document.getElementById('imagemFoto');
    const videoPronto=document.getElementById('videoPronto');
    let streamCamera=null;
    let cameraFrontal=true;
    let gravador=null;
    let partesVideo=[];
    let gravacaoAtiva=false;
    let animacao=null;
    let cronometro=null;
    let inicioGravacao=0;
    let fotoBlob=null;
    let fotoUrl='';
    let videoBlob=null;
    let videoUrl='';
    let extensaoVideo='webm';
    let imagemGaleria=null;
    let larguraGaleria=0;
    let alturaGaleria=0;
    let escalaBaseGaleria=1;
    let zoomGaleria=1;
    let deslocamentoX=0;
    let deslocamentoY=0;
    let ponteiros=new Map();
    let distanciaAnterior=0;

    async function abrirCamera(){
      erro.style.display='none';
      try{
        if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw new Error('Câmera não disponível');
        if(streamCamera) streamCamera.getTracks().forEach(track=>track.stop());
        streamCamera=await navigator.mediaDevices.getUserMedia({
          video:{facingMode:{ideal:cameraFrontal?'user':'environment'},width:{ideal:3840},height:{ideal:2160},frameRate:{ideal:30,max:30}},
          audio:true
        });
        camera.srcObject=streamCamera;
        const trilhaCamera=streamCamera.getVideoTracks()[0];
        const capacidades=trilhaCamera.getCapabilities?.();
        if(capacidades?.zoom) await trilhaCamera.applyConstraints({advanced:[{zoom:capacidades.zoom.min}]});
        camera.classList.toggle('espelho',cameraFrontal);
        await camera.play();
        inicio.style.display='none';
        controles.style.display='flex';
      }catch(e){
        erro.textContent='Não foi possível abrir a câmera. Abra o link no Safari ou Chrome e permita câmera e microfone.';
        erro.style.display='block';
      }
    }

    function desenharCapa(ctx,origem,origemW,origemH,destinoW,destinoH,espelhar){
      const escala=Math.max(destinoW/origemW,destinoH/origemH);
      const corteW=destinoW/escala;
      const corteH=destinoH/escala;
      const corteX=(origemW-corteW)/2;
      const corteY=(origemH-corteH)/2;
      ctx.save();
      if(espelhar){ctx.translate(destinoW,0);ctx.scale(-1,1)}
      ctx.drawImage(origem,corteX,corteY,corteW,corteH,0,0,destinoW,destinoH);
      ctx.restore();
    }

    async function garantirMoldura(){
      try{if(!moldura.complete) await moldura.decode();return true}catch(e){alert('A moldura não foi encontrada. Confira se o arquivo se chama moldura.png.');return false}
    }

    async function criarFotoFinal(origem,largura,altura,espelhar=false){
      if(!(await garantirMoldura())) return;
      canvasFoto.width=1440;
      canvasFoto.height=2560;
      const ctx=canvasFoto.getContext('2d');
      ctx.imageSmoothingEnabled=true;
      ctx.imageSmoothingQuality='high';
      desenharCapa(ctx,origem,largura,altura,canvasFoto.width,canvasFoto.height,espelhar);
      ctx.drawImage(moldura,0,0,canvasFoto.width,canvasFoto.height);
      fotoBlob=await new Promise(resolve=>canvasFoto.toBlob(resolve,'image/jpeg',0.99));
      if(!fotoBlob){alert('Não foi possível preparar essa foto. Tente escolher outra imagem.');return}
      if(fotoUrl) URL.revokeObjectURL(fotoUrl);
      fotoUrl=URL.createObjectURL(fotoBlob);
      imagemFoto.src=fotoUrl;
      preparando.style.display='none';
      inicio.style.display='none';
      controles.style.display='none';
      previaFoto.style.display='flex';
    }

    function limitarPosicaoGaleria(){
      const escala=escalaBaseGaleria*zoomGaleria;
      const sobraX=Math.max(0,(larguraGaleria*escala-canvasEditor.width)/2);
      const sobraY=Math.max(0,(alturaGaleria*escala-canvasEditor.height)/2);
      deslocamentoX=Math.max(-sobraX,Math.min(sobraX,deslocamentoX));
      deslocamentoY=Math.max(-sobraY,Math.min(sobraY,deslocamentoY));
    }

    function desenharEditorGaleria(){
      if(!imagemGaleria) return;
      const ctx=canvasEditor.getContext('2d');
      const escala=escalaBaseGaleria*zoomGaleria;
      const largura=larguraGaleria*escala;
      const altura=alturaGaleria*escala;
      ctx.clearRect(0,0,canvasEditor.width,canvasEditor.height);
      ctx.imageSmoothingEnabled=true;
      ctx.imageSmoothingQuality='high';
      ctx.drawImage(imagemGaleria,(canvasEditor.width-largura)/2+deslocamentoX,(canvasEditor.height-altura)/2+deslocamentoY,largura,altura);
      ctx.drawImage(moldura,0,0,canvasEditor.width,canvasEditor.height);
    }

    function redefinirEnquadramento(){
      escalaBaseGaleria=Math.max(canvasEditor.width/larguraGaleria,canvasEditor.height/alturaGaleria);
      zoomGaleria=1;
      deslocamentoX=0;
      deslocamentoY=0;
      desenharEditorGaleria();
    }

    async function abrirEditorGaleria(imagem,largura,altura){
      if(!(await garantirMoldura())) return;
      imagemGaleria=imagem;
      larguraGaleria=largura;
      alturaGaleria=altura;
      redefinirEnquadramento();
      preparando.style.display='none';
      inicio.style.display='none';
      controles.style.display='none';
      previaFoto.style.display='none';
      editorGaleria.style.display='flex';
    }

    function desenharGaleriaEmAltaResolucao(){
      canvasFoto.width=1440;
      canvasFoto.height=2560;
      const ctx=canvasFoto.getContext('2d');
      const proporcao=canvasFoto.width/canvasEditor.width;
      const escala=escalaBaseGaleria*zoomGaleria*proporcao;
      const largura=larguraGaleria*escala;
      const altura=alturaGaleria*escala;
      ctx.imageSmoothingEnabled=true;
      ctx.imageSmoothingQuality='high';
      ctx.drawImage(imagemGaleria,(canvasFoto.width-largura)/2+deslocamentoX*proporcao,(canvasFoto.height-altura)/2+deslocamentoY*proporcao,largura,altura);
      ctx.drawImage(moldura,0,0,canvasFoto.width,canvasFoto.height);
    }

    async function concluirEdicaoGaleria(){
      if(!imagemGaleria) return;
      preparando.style.display='flex';
      desenharGaleriaEmAltaResolucao();
      fotoBlob=await new Promise(resolve=>canvasFoto.toBlob(resolve,'image/jpeg',0.99));
      if(!fotoBlob){preparando.style.display='none';alert('Não foi possível preparar essa foto.');return}
      if(fotoUrl) URL.revokeObjectURL(fotoUrl);
      fotoUrl=URL.createObjectURL(fotoBlob);
      imagemFoto.src=fotoUrl;
      editorGaleria.style.display='none';
      preparando.style.display='none';
      previaFoto.style.display='flex';
    }

    async function fotografar(){
      if(!camera.videoWidth) return;
      await criarFotoFinal(camera,camera.videoWidth,camera.videoHeight,cameraFrontal);
    }

    function abrirSeletorGaleria(){
      seletorGaleria.value='';
      seletorGaleria.click();
    }

    async function carregarFotoDaGaleria(evento){
      const arquivo=evento.target.files?.[0];
      if(!arquivo) return;
      if(!arquivo.type.startsWith('image/')){alert('Escolha um arquivo de imagem.');return}
      preparando.style.display='flex';
      let imagem=null;
      let urlTemporaria='';
      try{
        if('createImageBitmap' in window){
          imagem=await createImageBitmap(arquivo,{imageOrientation:'from-image'});
          await abrirEditorGaleria(imagem,imagem.width,imagem.height);
        }else{
          urlTemporaria=URL.createObjectURL(arquivo);
          imagem=new Image();
          await new Promise((resolve,reject)=>{imagem.onload=resolve;imagem.onerror=reject;imagem.src=urlTemporaria});
          await abrirEditorGaleria(imagem,imagem.naturalWidth,imagem.naturalHeight);
        }
      }catch(e){
        preparando.style.display='none';
        alert('Não foi possível abrir essa foto. Tente escolher outra imagem.');
      }finally{
        if(urlTemporaria) URL.revokeObjectURL(urlTemporaria);
      }
    }

    function distanciaEntrePonteiros(){
      const pontos=[...ponteiros.values()];
      if(pontos.length<2) return 0;
      return Math.hypot(pontos[0].x-pontos[1].x,pontos[0].y-pontos[1].y);
    }

    canvasEditor.addEventListener('pointerdown',evento=>{
      canvasEditor.setPointerCapture(evento.pointerId);
      ponteiros.set(evento.pointerId,{x:evento.clientX,y:evento.clientY});
      if(ponteiros.size===2) distanciaAnterior=distanciaEntrePonteiros();
    });

    canvasEditor.addEventListener('pointermove',evento=>{
      const anterior=ponteiros.get(evento.pointerId);
      if(!anterior) return;
      const escalaTela=canvasEditor.width/canvasEditor.getBoundingClientRect().width;
      if(ponteiros.size===1){
        deslocamentoX+=(evento.clientX-anterior.x)*escalaTela;
        deslocamentoY+=(evento.clientY-anterior.y)*escalaTela;
      }
      ponteiros.set(evento.pointerId,{x:evento.clientX,y:evento.clientY});
      if(ponteiros.size===2){
        const distancia=distanciaEntrePonteiros();
        if(distanciaAnterior>0) zoomGaleria=Math.max(1,Math.min(5,zoomGaleria*(distancia/distanciaAnterior)));
        distanciaAnterior=distancia;
      }
      limitarPosicaoGaleria();
      desenharEditorGaleria();
    });

    function finalizarPonteiro(evento){
      ponteiros.delete(evento.pointerId);
      distanciaAnterior=ponteiros.size===2?distanciaEntrePonteiros():0;
    }
    canvasEditor.addEventListener('pointerup',finalizarPonteiro);
    canvasEditor.addEventListener('pointercancel',finalizarPonteiro);

    function renderizarVideo(){
      if(!gravacaoAtiva) return;
      const ctx=canvasVideo.getContext('2d');
      desenharCapa(ctx,camera,camera.videoWidth,camera.videoHeight,canvasVideo.width,canvasVideo.height,cameraFrontal);
      ctx.drawImage(moldura,0,0,canvasVideo.width,canvasVideo.height);
      animacao=requestAnimationFrame(renderizarVideo);
    }

    function escolherFormato(){
      const tipos=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
      return tipos.find(tipo=>MediaRecorder.isTypeSupported(tipo))||'';
    }

    async function iniciarVideo(){
      if(!camera.videoWidth||!(await garantirMoldura())) return;
      if(!window.MediaRecorder||!canvasVideo.captureStream){alert('A gravação de vídeo não é compatível com este navegador.');return}
      canvasVideo.width=720;canvasVideo.height=1280;gravacaoAtiva=true;renderizarVideo();
      const streamCanvas=canvasVideo.captureStream(30);
      const streamFinal=new MediaStream([...streamCanvas.getVideoTracks(),...streamCamera.getAudioTracks()]);
      const tipo=escolherFormato();
      extensaoVideo=tipo.includes('mp4')?'mp4':'webm';partesVideo=[];
      gravador=tipo?new MediaRecorder(streamFinal,{mimeType:tipo,videoBitsPerSecond:4000000}):new MediaRecorder(streamFinal);
      gravador.ondataavailable=evento=>{if(evento.data&&evento.data.size) partesVideo.push(evento.data)};
      gravador.onstop=finalizarVideo;gravador.start(250);
      ['gravarVideo','tirarFoto','trocarCamera','escolherGaleria'].forEach(id=>document.getElementById(id).style.display='none');
      document.getElementById('pararVideo').style.display='block';
      gravando.style.display='block';inicioGravacao=Date.now();tempo.textContent='00:00';
      cronometro=setInterval(()=>{const segundos=Math.floor((Date.now()-inicioGravacao)/1000);tempo.textContent=`${String(Math.floor(segundos/60)).padStart(2,'0')}:${String(segundos%60).padStart(2,'0')}`},500);
    }

    function pararVideo(){
      if(!gravador||gravador.state==='inactive') return;
      preparando.style.display='flex';gravacaoAtiva=false;
      if(animacao) cancelAnimationFrame(animacao);
      clearInterval(cronometro);gravando.style.display='none';gravador.stop();
    }

    function finalizarVideo(){
      const tipo=gravador.mimeType||(extensaoVideo==='mp4'?'video/mp4':'video/webm');
      videoBlob=new Blob(partesVideo,{type:tipo});
      if(videoUrl) URL.revokeObjectURL(videoUrl);
      videoUrl=URL.createObjectURL(videoBlob);videoPronto.src=videoUrl;
      preparando.style.display='none';controles.style.display='none';previaVideo.style.display='flex';restaurarControles();
    }

    function restaurarControles(){
      ['gravarVideo','tirarFoto','trocarCamera','escolherGaleria'].forEach(id=>document.getElementById(id).style.display='block');
      document.getElementById('pararVideo').style.display='none';
    }

    function voltarParaCamera(){
      previaFoto.style.display='none';
      if(streamCamera&&streamCamera.active){controles.style.display='flex'}else{inicio.style.display='flex'}
    }

    function baixar(blob,nome,url){
      if(!blob) return;
      const link=document.createElement('a');link.href=url;link.download=nome;document.body.appendChild(link);link.click();link.remove();
    }

    async function compartilhar(blob,nome,tipo,url){
      if(!blob) return;
      const arquivo=new File([blob],nome,{type:tipo});
      if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[arquivo]}))){
        try{await navigator.share({files:[arquivo],title:'Registro com moldura'});return}catch(e){if(e.name==='AbortError')return}
      }
      baixar(blob,nome,url);
    }

    document.getElementById('abrirCamera').addEventListener('click',abrirCamera);
    document.getElementById('abrirGaleria').addEventListener('click',abrirSeletorGaleria);
    document.getElementById('escolherGaleria').addEventListener('click',abrirSeletorGaleria);
    document.getElementById('outraGaleria').addEventListener('click',abrirSeletorGaleria);
    document.getElementById('redefinirFoto').addEventListener('click',redefinirEnquadramento);
    document.getElementById('concluirEdicao').addEventListener('click',concluirEdicaoGaleria);
    document.getElementById('cancelarEdicao').addEventListener('click',()=>{
      editorGaleria.style.display='none';
      if(streamCamera&&streamCamera.active){controles.style.display='flex'}else{inicio.style.display='flex'}
    });
    seletorGaleria.addEventListener('change',carregarFotoDaGaleria);
    document.getElementById('trocarCamera').addEventListener('click',async()=>{cameraFrontal=!cameraFrontal;await abrirCamera()});
    document.getElementById('tirarFoto').addEventListener('click',fotografar);
    document.getElementById('gravarVideo').addEventListener('click',iniciarVideo);
    document.getElementById('pararVideo').addEventListener('click',pararVideo);
    document.getElementById('novaFoto').addEventListener('click',voltarParaCamera);
    document.getElementById('novoVideo').addEventListener('click',()=>{videoPronto.pause();previaVideo.style.display='none';controles.style.display='flex'});
    document.getElementById('salvarFoto').addEventListener('click',()=>baixar(fotoBlob,'foto-com-moldura.jpg',fotoUrl));
    document.getElementById('compartilharFoto').addEventListener('click',()=>compartilhar(fotoBlob,'foto-com-moldura.jpg','image/jpeg',fotoUrl));
    document.getElementById('salvarVideo').addEventListener('click',()=>baixar(videoBlob,`video-com-moldura.${extensaoVideo}`,videoUrl));
    document.getElementById('compartilharVideo').addEventListener('click',()=>compartilhar(videoBlob,`video-com-moldura.${extensaoVideo}`,videoBlob?.type||'video/webm',videoUrl));
    window.addEventListener('beforeunload',()=>{
      if(streamCamera) streamCamera.getTracks().forEach(track=>track.stop());
      if(fotoUrl) URL.revokeObjectURL(fotoUrl);
      if(videoUrl) URL.revokeObjectURL(videoUrl);
    });
  </script>
</body>
</html>m,
